[tab MANUAL]
art file=skin/looks/_bg_block.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALPUNCH: TRANSIENT SHAPER" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:0
text cx=60 cy=280 label="Makes every hit snap harder or softer, and pulls the tail up or tightens it, with no threshold to set. It reacts" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=312 label="to how quickly each hit rises and falls, not to how loud the track is, so it works the same on quiet and loud" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=344 label="material." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=392 label="Add it as an insert effect on a track, program, pad or bus. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=424 label="Tap a preset on the PUNCH page, then fine-tune ATTACK and SUSTAIN." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=456 label="On a whole drum bus, Punchy Drums or Break Smack is a good start." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=488 label="The meter shows the boost or cut as it happens." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=536 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=280 label="ATTACK: up for more snap at the start of each hit (to about +18 dB), down to soften it." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=312 label="SUSTAIN: up to bring the tail and the room up, down to tighten and dry things out." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=344 label="SPEED: TIGHT, MEDIUM or SLOW. How long the attack part lasts and how long the tail is followed." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=376 label="FOCUS: what it listens to. FULL, LOWS (kicks, bass) or HIGHS (snares, hats). The whole sound is always" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=408 label="shaped." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=440 label="CLIP: a soft clipper after the shaper, to catch the extra peaks and add a little bite." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=472 label="AUTO LEVEL: evens the loudness going in and coming out, so a punchier setting is not just louder." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=504 label="MIX: blend with the original sound. OUTPUT: the level after the effect." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=536 label="ROLL: one tap for a random setting that still sounds good. MILD, MEDIUM or WILD sets how far it goes." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=60 cy=240 label="PRESETS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:2
text cx=60 cy=280 label="One tap on the PUNCH page, and in the MPC's PRESET menu. Each one is a starting point." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=328 label="Drums: Punchy Drums, Kick Snap, Snare Crack, Break Smack, Dry Drums, Big Room, Hat Tick, Soft Hits." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=360 label="Other sounds: Bass Pluck, Keys & Guitar, Lush Sustain. Flat switches the shaping off." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=392 label="Drum-bus pairs: Boom Bap Bus, Lo-Fi Bus, Modern Bus and Glue Bus are in PotentialHeat too. Put Punch first" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=424 label="and Heat after it on your drum bus, and pick the same name in each." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=456 label="Chain presets: 90s Stab, Break Bus and Dub Drums. See the CHAINS page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=240 label="FX CHAINS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:3
text cx=60 cy=280 label="Put the plugins on a track's inserts in the order shown, then pick the same preset name in each one." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=328 label="90s STAB (chopped horns, keys and vocal stabs): Grit > PUNCH > Bleed > Patina" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=360 label="BREAK BUS (a boom-bap drum bus): PUNCH > Grit > Bleed > Patina" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=392 label="DUB DRUMS (lo-fi dub drums): Patina > PUNCH > Bleed > Grit" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=424 label="DUSTY LOOP (soul, jazz and library loops): Bleed > Patina > Grit. Punch is not in this one." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=472 label="Here the name is on the PRESETS buttons. In Patina, Grit and Bleed it is in the MPC's PRESET menu." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=520 label="Rules of thumb: Punch early, Bleed before Patina, echo and chop last, one noise source per chain, and match" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=552 label="levels with OUTPUT before you decide." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=240 label="USER PRESETS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=280 label="To save: open the USER page, tap SAVE, then tap a slot. The slot now reads USER and its number." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=312 label="To load: tap a slot. The slot you loaded last is lit." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=344 label="Saving to a slot that is already filled replaces it straight away." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=376 label="The 8 slots are kept on the drive the plugin is on, in a folder called PotentialSuite Presets. Every project" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=408 label="and every copy of the plugin sees them, and updating the plugin keeps them." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=440 label="A chain of your own: save each plugin's part to the same slot number, for example USER 3 in Punch, Grit and" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=472 label="Bleed. Later, tap USER 3 in each." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=504 label="A slot keeps the knobs and switches. It does not keep the ROLL setting or the look." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=280 label="Q-Links: ATTACK, SUSTAIN, MIX, OUTPUT, PRESET, SPEED, FOCUS and CLIP." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=312 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=344 label="Looks: Print Plate, Night Rack or Colour Block, on the SETTINGS page. A new look shows the next time the" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=376 label="plugin loads." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=408 label="Turning ATTACK up raises the peaks. Leave CLIP on, or lower OUTPUT, if the track gets close to clipping." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=440 label="Stereo in, stereo out, at 44.1 kHz. No added delay." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=488 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialpunch" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
